name: Lint

on: [push, pull_request]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --all-extras --with test
      - name: Test with pytest
        run: poetry run pytest -m "not integration"

  core_compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.14" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install base package with minimum docstring-parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "docstring-parser==0.18.0" "pytest>=8.2.2,<9"
          python -m pip check
      - name: Test tool parsing and execution
        run: python -m pytest tests/utils/test_tool_manager.py
